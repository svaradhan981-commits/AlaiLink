services:
  db:
    image: pgvector/pgvector:pg16
    container_name: alailink-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: alailink
      POSTGRES_USER: alailink
      POSTGRES_PASSWORD: alailink
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U alailink -d alailink"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: alailink-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      APP_NAME: AlaiLink
      ENVIRONMENT: production
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-*}
      DATABASE_URL: postgresql+psycopg://alailink:alailink@db:5432/alailink
      LLM_PROVIDER: ${LLM_PROVIDER:-openai_compatible}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.5-flash-lite}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://generativelanguage.googleapis.com/v1beta/openai/}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_FALLBACK_MODEL: ${LLM_FALLBACK_MODEL:-}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-90}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-1}
      LLM_RETRY_DELAY_SECONDS: ${LLM_RETRY_DELAY_SECONDS:-1}
      LLM_DEFAULT_INPUT_COST_PER_MILLION: ${LLM_DEFAULT_INPUT_COST_PER_MILLION:-0.075}
      LLM_DEFAULT_OUTPUT_COST_PER_MILLION: ${LLM_DEFAULT_OUTPUT_COST_PER_MILLION:-0.30}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-gemini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-gemini-embedding-001}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://generativelanguage.googleapis.com/v1beta}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-768}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
